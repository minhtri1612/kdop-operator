            type: string
          metadata:
            type: object
          spec:
            description: DockerDeploymentSpec defines the desired state of DockerDeployment
            properties:
              replicas:
                default: 1
                description: Replicas is the number of desired containers
                format: int32
                type: integer
              selector:
                description: |-
                  Selector is a label query over containers that should match the replica count.
                  It must match the container template's labels.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
