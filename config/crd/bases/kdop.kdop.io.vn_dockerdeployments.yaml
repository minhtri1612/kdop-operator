                                    name:
                                      description: Name of the Secret
                                      type: string
                                  required:
                                  - key
                                  - name
                                  type: object
                              type: object
                          required:
                          - name
                          type: object
                        type: array
                      healthCheck:
                        description: HealthCheck configures Docker's native health
                          check.
                        properties:
                          interval:
                            description: Interval between checks (e.g. "5s")
                            type: string
                          retries:
                            description: Retries before marking unhealthy
                            type: integer
                          test:
                            description: Test is the check command, e.g. ["CMD-SHELL",
