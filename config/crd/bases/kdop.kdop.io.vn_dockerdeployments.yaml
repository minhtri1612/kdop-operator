                              type: string
                            secretName:
                              description: SecretName is the Secret in the same namespace
                              type: string
                          required:
                          - mountPath
                          - secretName
                          type: object
                        type: array
                      volumeMounts:
                        description: VolumeMounts binds host paths into the container.
                        items:
                          description: VolumeMount binds a host path into the container.
                          properties:
                            containerPath:
                              description: ContainerPath is the absolute path in the
