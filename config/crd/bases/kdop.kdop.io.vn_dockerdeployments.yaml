                        type: string
                      managementMode:
                        description: |-
                          ManagementMode controls whether the operator only observes runtime state
                          or actively reconciles the container toward the desired spec.
                        enum:
                        - Observe
                        - Enforce
                        type: string
                      ports:
                        items:
                          type: string
                        type: array
                      resources:
                        description: Resources sets CPU/Memory limits for the container.
                        properties:
                          cpuLimit:
                            description: CPULimit in cores, e.g. "0.5" or "2"
                            type: string
                          memoryLimit:
                            description: MemoryLimit e.g. "256m", "1g"
                            type: string
                        type: object
                      restartPolicy:
                        default: always
                        description: 'RestartPolicy: no | on-failure | always | unless-stopped'
                        enum:
                        - "no"
                        - on-failure
                        - always
                        - unless-stopped
                        type: string
