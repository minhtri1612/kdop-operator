apiVersion: kdop.kdop.io.vn/v1alpha1
kind: DockerContainer
metadata:
  name: dockercontainer-sample
spec:
  image: nginx:latest
  containerName: nginx-demo
  restartPolicy: always
  ports:
    - "8091:80"
  env:
    - "APP_ENV=dev"
  envVars:
    - name: GREETING
      value: hello
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: demo-secret
          key: password
  volumeMounts:
  - hostPath: /tmp/kdop-demo
    containerPath: /usr/share/nginx/html
    readOnly: true
  secretVolumes:
  - secretName: app-config
    mountPath: /etc/secrets
  imagePullSecret: registry-cred
  healthCheck:
    test: ["CMD-SHELL", "pidof nginx || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 3
  resources:
    cpuLimit: "0.5"
    memoryLimit: "128m"   

