apiVersion: v1
kind: Namespace
metadata:
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-gateway
  namespace: system
  labels:
    app: tunnel-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel-gateway
  template:
    metadata:
      labels:
        app: tunnel-gateway
    spec:
      containers:
      - name: gateway
        image: IMG_PLACEHOLDER        
        imagePullPolicy: IfNotPresent
        command: ["/manager", "tunnel", "-mode", "gateway", "-gateway-addr", ":8080"]
        ports:
        - containerPort: 8080
          name: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: tunnel-gateway
  namespace: system
spec:
  selector:
    app: tunnel-gateway
  type: NodePort
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30000