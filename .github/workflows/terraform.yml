name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write   # OIDC → AWS
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: terraform
  AWS_REGION: ap-southeast-2
  TF_VAR_enable_ssm: "true"
  TF_VAR_enable_ssh: "false"
  TF_VAR_admin_cidr: ${{ secrets.TF_ADMIN_CIDR }}
  # false = no fake remote Docker VPS (destroy worker EC2 to save cost)
  TF_VAR_worker_enabled: "false"

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString())
            core.info(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref,
              workflow_ref: payload.workflow_ref,
            }, null, 2))

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Hardcode ARN temporarily to rule out secret formatting issues
          role-to-assume: arn:aws:iam::629954427603:role/github-actions-kdop-terraform
          role-session-name: gha-kdop-terraform-plan
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Write backend.hcl
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "control-plane/terraform.tfstate"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_STATE_LOCK_TABLE}"
          encrypt        = true
          EOF

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var="use_spot=true" \
            -var="aws_region=${AWS_REGION}"
          echo "PLAN_EXIT=$?" >> "$GITHUB_ENV"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // lightweight notice — full plan is in Actions log / artifact
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform Plan\nPlan finished. See workflow logs / `tfplan` artifact.\n\nApply runs on `main` (or workflow_dispatch → apply) after review.'
            });

  apply:
    name: Terraform Apply
    # On push to main: after plan. On manual apply: standalone.
    needs: [plan]
    if: |
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
      )
    runs-on: ubuntu-latest
    environment: aws-prod
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-kdop-terraform-apply
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Write backend.hcl
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${TF_STATE_BUCKET}"
          key            = "control-plane/terraform.tfstate"
          region         = "${AWS_REGION}"
          dynamodb_table = "${TF_STATE_LOCK_TABLE}"
          encrypt        = true
          EOF

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -input=false

      - name: Terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var="use_spot=true" \
            -var="aws_region=${AWS_REGION}"
