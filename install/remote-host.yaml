# Remote Docker API via reverse tunnel (apply from EC2 after setting TUNNEL_TOKEN).
# VPS runs scripts/vps-tunnel-client.sh — dials OUT to gateway NodePort :30000.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remote-docker-tunnel-targets
  namespace: system
data:
  # On the VPS, tunnel client dials this address when operator opens Docker API.
  targets: "127.0.0.1:2375"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-docker-tunnel
  namespace: system
  labels:
    app: remote-docker-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remote-docker-tunnel
  template:
    metadata:
      labels:
        app: remote-docker-tunnel
    spec:
      containers:
        - name: server
          image: kdop-operator:v0.0.2
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - tunnel
            - -mode=server
            - -listen-addr=:2375
            - -ws-addr=:8081
            - -auth-token=REPLACE_ME_TUNNEL_TOKEN
            - -targets-file=/etc/tunnel/targets
          ports:
            - containerPort: 2375
              name: docker
            - containerPort: 8081
              name: ws
          volumeMounts:
            - name: targets
              mountPath: /etc/tunnel
      volumes:
        - name: targets
          configMap:
            name: remote-docker-tunnel-targets
            items:
              - key: targets
                path: targets
---
apiVersion: v1
kind: Service
metadata:
  name: remote-docker-tunnel
  namespace: system
spec:
  selector:
    app: remote-docker-tunnel
  ports:
    - name: docker
      port: 2375
      targetPort: 2375
    - name: ws
      port: 8081
      targetPort: 8081
---
apiVersion: kdop.kdop.io.vn/v1alpha1
kind: DockerHost
metadata:
  name: friend-vps
  namespace: system
spec:
  hostURL: tcp://remote-docker-tunnel.system.svc:2375
