                type: string
              networkMode:
                description: NetworkMode for tunnel client (e.g. "kind", "bridge")
                type: string
              ports:
                description: Ports maps K8s Service port -> container port
                items:
                  description: ServicePort defines a port mapping
                  properties:
                    name:
                      description: Name of the port
                      type: string
                    port:
                      description: Port exposed on the Kubernetes Service
                      format: int32
                      type: integer
                    targetPort:
                      description: TargetPort on the Docker container
                      format: int32
                      type: integer
                  required:
                  - port
                  - targetPort
                  type: object
                minItems: 1
                type: array
              selector:
                description: Selector matches multiple DockerContainers for load balancing
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - ports
            type: object
          status:
            description: status defines the observed state of DockerService
            properties:
              message:
                description: Message describes the last error or status detail
                type: string
              phase:
                description: 'Phase: Pending | Active | Error'
                type: string
              tunnelClients:
                description: TunnelClients is the count of active tunnel client containers
                type: integer
              tunnelServerURL:
                description: TunnelServerURL is the internal WebSocket URL of the
                  tunnel server
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
