# Profile: mysql-db — kdop Enforce on friend-vps
# Do not docker compose up/down this service; the operator owns the container name.

dockerHost:
  enabled: false

dockerDeployment:
  enabled: false

dockerService:
  enabled: false

dockerJob:
  enabled: false

dockerContainer:
  enabled: true
  image: mysql:8.0
  containerName: mysql-db
  dockerHostRef: friend-vps
  restartPolicy: always
  managementMode: Enforce
  networkMode: food_order_website_default
  ports:
    - "3307:3306"
  envVars:
    - name: MYSQL_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: food-mysql
          key: MYSQL_ROOT_PASSWORD
    - name: MYSQL_DATABASE
      valueFrom:
        secretKeyRef:
          name: food-mysql
          key: MYSQL_DATABASE
    - name: MYSQL_USER
      valueFrom:
        secretKeyRef:
          name: food-mysql
          key: MYSQL_USER
    - name: MYSQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: food-mysql
          key: MYSQL_PASSWORD
