# Profile: food-backend — kdop Enforce on friend-vps
# Do not docker compose up/down this service; the operator owns the container name.

dockerHost:
  enabled: false

dockerDeployment:
  enabled: false

dockerService:
  enabled: false

dockerJob:
  enabled: false

dockerContainer:
  enabled: true
  image: food_order_website-backend
  containerName: food-backend
  dockerHostRef: friend-vps
  restartPolicy: always
  managementMode: Enforce
  networkMode: food_order_website_default
  ports:
    - "3001:3000"
